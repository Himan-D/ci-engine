# SPDX-License-Identifier: MIT
# CI Engine - GitHub Actions CI Workflow

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  PYTHON_VERSION: "3.12"
  DOCKER_BUILDKIT: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install ruff

      - name: Run ruff linter
        run: |
          ruff check ci_engine/ tests/ --output-format=github
        continue-on-error: true

      - name: Run ruff formatter check
        run: |
          ruff format --check ci_engine/ tests/
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run pytest
        run: |
          pytest tests/ -v --cov=ci_engine --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
        continue-on-error: true

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server
          push: false
          tags: ci-engine/server:latest,ci-engine/server:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.agent
          push: false
          tags: ci-engine/agent:latest,ci-engine/agent:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker images
        run: |
          docker run --rm ci-engine/server:latest python -c "from ci_engine.server.main import app; print('Server OK')"
          docker run --rm ci-engine/agent:latest python -c "from ci_engine.agent.agent import Agent; print('Agent OK')"
          echo "Server imports: OK"
          echo "Agent imports: OK"

      - name: Verify server startup
        run: |
          docker run -d --name ci-test-server -p 8888:8000 ci-engine/server:latest
          sleep 5
          docker logs ci-test-server
          curl -f http://localhost:8888/health || echo "Health check skipped"
          docker stop ci-test-server
        continue-on-error: true

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()
    steps:
      - name: Success notification
        if: needs.build.result == 'success'
        run: echo "CI passed!"

      - name: Failure notification
        if: needs.build.result == 'failure'
        run: echo "CI failed!"