[project]
name = "ci-engine"
version = "0.1.0"
description = "A Buildkite alternative CI/CD platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "aiosqlite>=0.19.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.0.0",
    "requests>=2.31.0",
    "cryptography>=42.0.0",
    "aiobotocore>=2.5.0",
    "pyjwt[crypto]>=2.8.0",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "psycopg2-binary>=2.9.0",
    "websocket-client>=1.7.0",
    "croniter>=2.0.0",
    "prometheus-client>=0.19.0",
    "bcrypt>=4.1.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34.0"]
gcp = ["google-auth>=2.28.0"]
azure = ["azure-identity>=1.16.0"]
k8s = ["kubernetes>=28.0.0"]
# AI provider extras
# litellm is the single dependency that covers all 100+ providers.
# Individual SDK packages (anthropic, openai) can still be installed alongside
# litellm for direct-SDK usage, but are not required for CI Engine's AI features.
ai           = ["litellm>=1.0.0"]          # all providers via litellm
ai-anthropic = ["litellm>=1.0.0", "anthropic>=0.40.0"]   # + native Anthropic SDK
ai-openai    = ["litellm>=1.0.0", "openai>=1.0.0"]        # + native OpenAI SDK
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ci_engine*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]