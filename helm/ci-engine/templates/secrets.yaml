apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ci-engine.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "ci-engine.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-engine-secrets
type: Opaque
stringData:
  database-url: postgresql://ci_engine:password@postgres:5432/ci_engine
  redis-url: redis://redis:6379
  secret-key: change-me-in-production
  encryption-key: change-me-in-production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ci-engine-config
data:
  log-level: "info"
  log-format: "json"
  s3-bucket: "ci-engine-artifacts"