version: '3.8'

services:
  # CI Engine API Server
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///ci_engine.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - LOG_FORMAT=json
    volumes:
      - ./ci_engine.db:/app/ci_engine.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # CI Engine Agent (optional)
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      - SERVER_URL=http://server:8000
      - AGENT_NAME=docker-agent
      - AGENT_labels=docker
    depends_on:
      server:
        condition: service_healthy

  # Frontend Dashboard
  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_BASE=http://localhost:8000
      - PORT=3000
    depends_on:
      server:
        condition: service_healthy
    profiles:
      - dashboard

networks:
  default:
    name: ci-engine-network