# =============================================================================
# CI Engine - Production Docker Compose
# =============================================================================
# Usage:
#   1. Copy .env.example to .env and fill in values
#   2. Run: docker-compose -f docker-compose.prod.yml up -d
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: ci-engine-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ci_engine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ci_engine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci_engine"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        reservations:
          cpu: 100m
          memory: 256Mi
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ci-engine-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory=256mb --maxmemory-policy=allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpu: 250m
          memory: 256Mi
        reservations:
          cpu: 50m
          memory: 64Mi
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # CI Engine Server
  # ---------------------------------------------------------------------------
  server:
    image: ci-engine/server:latest
    container_name: ci-engine-server
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      DATABASE_URL: postgresql://ci_engine:${POSTGRES_PASSWORD}@db:5432/ci_engine
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CI_ENGINE_JWT_SECRET_KEY: ${CI_ENGINE_JWT_SECRET_KEY}
      CI_ENGINE_FERNET_KEY: ${CI_ENGINE_FERNET_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      CI_ENGINE_S3_BUCKET: ${CI_ENGINE_S3_BUCKET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpu: 1000m
          memory: 1Gi
        reservations:
          cpu: 250m
          memory: 512Mi
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - ci-engine-network

  # ---------------------------------------------------------------------------
  # CI Engine Agent
  # ---------------------------------------------------------------------------
  agent:
    image: ci-engine/agent:latest
    container_name: ci-engine-agent
    restart: unless-stopped
    environment:
      CI_SERVER_URL: http://server:8000
      CI_AGENT_NAME: ${CI_AGENT_NAME:-production-agent}
      CI_WORKSPACE: /workspace
      DOCKER_HOST: unix:///var/run/docker.sock
    depends_on:
      - server
    volumes:
      - workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpu: 2000m
          memory: 2Gi
        reservations:
          cpu: 500m
          memory: 512Mi
    security_opt:
      - no-new-privileges:true
    networks:
      - ci-engine-network

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (TLS Termination)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ci-engine-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpu: 250m
          memory: 128Mi
        reservations:
          cpu: 50m
          memory: 32Mi
    networks:
      - ci-engine-network

networks:
  ci-engine-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  workspace:
