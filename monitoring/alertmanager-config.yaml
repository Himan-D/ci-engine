global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@ci-engine.example.com'
  smtp_auth_username: 'alertmanager'
  smtp_auth_password: '${SMTP_PASSWORD}'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
  - match:
      severity: critical
    receiver: 'critical-alerts'
    continue: true
  - match:
      severity: warning
    receiver: 'warning-alerts'

receivers:
- name: 'default'
  webhook_configs:
  - url: 'http://ci-engine-server:8000/webhooks/alertmanager'
    send_resolved: true

- name: 'critical-alerts'
  webhook_configs:
  - url: '${DISCORD_WEBHOOK_URL}'
    send_resolved: true
  slack_configs:
  - channel: '#ci-engine-alerts'
    api_url: '${SLACK_WEBHOOK_URL}'
    title: 'CI Engine Critical Alert'
    color: 'danger'
    send_resolved: true

- name: 'warning-alerts'
  slack_configs:
  - channel: '#ci-engine-warnings'
    api_url: '${SLACK_WEBHOOK_URL}'
    title: 'CI Engine Warning'
    color: 'warning'
    send_resolved: true

inhibit_rules:
- source_match:
    severity: 'critical'
  target_match:
    severity: 'warning'
  equal: ['alertname', 'cluster', 'service']