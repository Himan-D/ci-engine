global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ci-engine-production'
    env: 'production'

alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - 'alertmanager.monitoring:9093'

rule_files:
  - '/etc/prometheus/rules/*.yaml'

scrape_configs:
- job_name: 'ci-engine-server'
  kubernetes_sd_configs:
  - role: pod
  relabel_configs:
  - source_labels: [__meta_kubernetes_pod_label_app]
    action: keep
    regex: ci-engine
  - source_labels: [__meta_kubernetes_pod_label_component]
    action: keep
    regex: server
  - source_labels: [__meta_kubernetes_pod_name]
    action: replace
    target_label: pod
  - source_labels: [__meta_kubernetes_namespace]
    action: replace
    target_label: namespace
  - source_labels: [__meta_kubernetes_pod_container_port_number]
    action: replace
    target_label: port

- job_name: 'ci-engine-agent'
  kubernetes_sd_configs:
  - role: pod
  relabel_configs:
  - source_labels: [__meta_kubernetes_pod_label_app]
    action: keep
    regex: ci-engine
  - source_labels: [__meta_kubernetes_pod_label_component]
    action: keep
    regex: agent
  - source_labels: [__meta_kubernetes_pod_name]
    action: replace
    target_label: pod

- job_name: 'ci-engine-redis'
  kubernetes_sd_configs:
  - role: pod
  relabel_configs:
  - source_labels: [__meta_kubernetes_pod_label_component]
    action: keep
    regex: redis

- job_name: 'node-exporter'
  kubernetes_sd_configs:
  - role: node

- job_name: 'kubelet'
  scheme: https
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  kubernetes_sd_configs:
  - role: node