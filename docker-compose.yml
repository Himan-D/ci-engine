version: "3.8"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ci_engine
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: ci_engine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory=256mb --maxmemory-policy=allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      DATABASE_URL: postgresql://ci_engine:devpassword@db:5432/ci_engine
      REDIS_URL: redis://redis:6379
      SECRET_KEY: dev-secret-key-change-in-production
      ENCRYPTION_KEY: Y29tcGxleC1rZXktMzItYnl0ZXMta2V5LWZvci1kZQ==
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: ci-engine-server
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ci_engine:/app/ci_engine
      - ./tests:/app/tests
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      CI_SERVER_URL: http://server:8000
      CI_AGENT_NAME: local-agent
      CI_WORKSPACE: /workspace
      DOCKER_HOST: unix:///var/run/docker.sock
    depends_on:
      - server
    volumes:
      - workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock

  otel-collector:
    image: otel/opentelemetry-collector:0.98.0
    command: ["--config=/etc/otel-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
    environment:
      LOG_LEVEL: debug

volumes:
  postgres_data:
  redis_data:
  workspace: