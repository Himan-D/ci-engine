apiVersion: v1
kind: Service
metadata:
  name: ci-engine-redis
  labels:
    app: ci-engine
    component: redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: ci-engine
    component: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-engine-redis
  labels:
    app: ci-engine
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-engine
      component: redis
  template:
    metadata:
      labels:
        app: ci-engine
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
        - redis-server
        - --maxmemory=256mb
        - --maxmemory-policy=allkeys-lru
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 512Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ci-engine-config
data:
  s3-bucket: "ci-engine-artifacts"
  log-level: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-engine-secrets
type: Opaque
stringData:
  database-url: "postgresql://postgres:password@ci-engine-db:5432/ci_engine"
  secret-key: "change-me-in-production"
  encryption-key: "32-byte-base64-encoded-key"
  jwt-secret: "change-me-in-production"